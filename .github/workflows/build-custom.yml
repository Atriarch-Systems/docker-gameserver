name: Build and Push Custom Game Server Images (Atriarch)
# Builds the shared custom base (lgsm-atr-custom-base) FIRST, then each custom
# (atr-*) game intermediate FROM it (Proton games) or FROM the LinuxGSM base
# (linux-native games, e.g. atr-rsdw), then triggers the Edge overlay -- the
# same two-stage flow as native games in build-atriarch.yml.

on:
  push:
    branches: [atriarch]
    paths:
      - 'custom/**'
      - '.github/workflows/build-custom.yml'
  workflow_dispatch:
    inputs:
      games:
        description: 'Comma-separated custom games to build (leave empty for all atr-*)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base:
    name: Build custom base (lgsm-atr-custom-base)
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atriarch

      # Opt-in shared/persistent BuildKit (see ci/buildkitd/). When the Actions
      # variable BUILDKIT_REMOTE_ENDPOINT is set, all builds share one warm,
      # PVC-backed daemon; otherwise fall back to a per-job local builder.
      - name: Set up Docker Buildx (remote/shared)
        if: vars.BUILDKIT_REMOTE_ENDPOINT != ''
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ vars.BUILDKIT_REMOTE_ENDPOINT }}
      - name: Set up Docker Buildx (local)
        if: vars.BUILDKIT_REMOTE_ENDPOINT == ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Atriarch Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push custom base
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: custom/_base/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/lgsm-atr-custom-base:latest
            ${{ secrets.DOCKER_REGISTRY }}/lgsm-atr-custom-base:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/lgsm-atr-custom-base:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/lgsm-atr-custom-base:buildcache,mode=max

  generate-matrix:
    name: Generate custom build matrix
    needs: build-base
    runs-on: [self-hosted, linux, arm64]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      games-json: ${{ steps.set-matrix.outputs.games-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atriarch

      - name: Generate matrix from serverlist.csv (atr-* only)
        id: set-matrix
        run: |
          if [ -n "${{ inputs.games }}" ]; then
            GAMES=$(echo "${{ inputs.games }}" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            GAMES=$(tail -n +2 serverlist.csv | cut -d',' -f1 | grep '^atr-' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "matrix={\"game\":$GAMES}" >> $GITHUB_OUTPUT
          echo "games-json=$GAMES" >> $GITHUB_OUTPUT
          echo "Building custom games: $GAMES"

  build-game:
    name: Build ${{ matrix.game }}
    needs: [build-base, generate-matrix]
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atriarch

      - name: Set up Docker Buildx (remote/shared)
        if: vars.BUILDKIT_REMOTE_ENDPOINT != ''
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ vars.BUILDKIT_REMOTE_ENDPOINT }}
      - name: Set up Docker Buildx (local)
        if: vars.BUILDKIT_REMOTE_ENDPOINT == ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Atriarch Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push intermediate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: custom/${{ matrix.game }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # Proton children read ATR_CUSTOM_BASE_IMAGE (digest-pinned to the base
          # built above) via their FROM ${ATR_CUSTOM_BASE_IMAGE}; linux-native
          # children (atr-rsdw) don't declare that ARG and ignore it (BuildKit
          # emits a harmless "unused build arg" notice).
          build-args: |
            ATR_CUSTOM_BASE_IMAGE=${{ secrets.DOCKER_REGISTRY }}/lgsm-atr-custom-base@${{ needs.build-base.outputs.digest }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/gameserver:${{ matrix.game }}-intermediate
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/gameserver:cache-${{ matrix.game }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/gameserver:cache-${{ matrix.game }},mode=max

  trigger-edge-build:
    name: Trigger Edge API Build
    needs: [generate-matrix, build-game]
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Trigger Atriarch.GameHosting.Edge workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          repository: Atriarch-Systems/Atriarch.GameHosting.Edge
          event-type: gameserver-intermediate-built
          client-payload: '{"games": ${{ needs.generate-matrix.outputs.games-json }}, "run_id": "${{ github.run_id }}"}'
