name: Merge Main to Atriarch
# Runs after `Sync Upstream to Main` completes. Merges newly-mirrored upstream
# commits from `main` into the customization branch `atriarch`.
#
# Auth: Uses the `atriarch-fork-sync` GitHub App instead of GITHUB_TOKEN
# because merges may include changes under .github/workflows/, which the
# default GITHUB_TOKEN is not permitted to modify.

on:
  workflow_run:
    workflows: ["Sync Upstream to Main"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read  # App token is used for writes; GITHUB_TOKEN stays read-only

jobs:
  merge-to-atriarch:
    if: github.repository == 'Atriarch-Systems/docker-gameserver'
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout atriarch
        uses: actions/checkout@v4
        with:
          ref: atriarch
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "atriarch-fork-sync[bot]"
          git config user.email "atriarch-fork-sync[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Check for new commits
        id: check
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          MERGE_BASE=$(git merge-base HEAD origin/main)
          if [ "$MAIN_SHA" != "$MERGE_BASE" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            COMMIT_COUNT=$(git rev-list --count HEAD..origin/main)
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge main into atriarch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge origin/main --no-edit -m "Merge upstream changes from main"

      - name: Validate Atriarch fork references
        run: |
          set -euo pipefail

          # These upstream references frequently reappear when generated files
          # are merged from upstream. Keep attribution comments and the sync
          # workflow's upstream remote, but fail on runtime image/script refs.
          patterns='GameServerManagers/(LinuxGSM|docker-gameserver)|ghcr\.io/gameservermanagers/linuxgsm|raw\.githubusercontent\.com/GameServerManagers/LinuxGSM'

          mapfile -t files < <(
            git ls-files \
              '*.sh' \
              '*.yml' \
              '*.yaml' \
              'Dockerfile*' \
              'dockerfiles/Dockerfile*' \
            | grep -v '^\.github/workflows/sync-upstream\.yml$'
          )

          violations=$(
            grep -nE "$patterns" "${files[@]}" \
              | grep -vE '^[^:]+:[0-9]+:# Original: ' \
              || true
          )

          if [ -n "$violations" ]; then
            echo "::error::Upstream GameServerManagers references found after merge. Convert runtime refs to Atriarch equivalents before pushing."
            echo "$violations"
            exit 1
          fi

      - name: Push atriarch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin atriarch

      - name: No changes
        if: steps.check.outputs.has_changes == 'false'
        run: echo "Atriarch branch is already up to date with main"
